<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Tour AI</title>
  <style>
    :root {
      --bg: #1a1b26;
      --text: #c0caf5;
      --accent: #7aa2f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top, #24283b 0, #1a1b26 45%, #151620 100%);
      color: var(--text);
    }
    h1 {
      font-size: 3rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
      margin: 0 1rem;
      text-shadow: 0 0 18px rgba(122, 162, 247, 0.6);
    }
  </style>
</head>
<body>
  <h1>Welcome to Live Tour AI</h1>
</body>
</html>
